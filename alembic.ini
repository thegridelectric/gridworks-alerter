# Alembic config for hand-running migrations (`uv run alembic revision
# --autogenerate -m "..."`). The service applies the chain itself when the
# store opens (see gwalerter/store.py); the URL here comes from
# AlerterSettings in env.py when sqlalchemy.url is left empty.
[alembic]
script_location = src/gwalerter/migrations
path_separator = os
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
