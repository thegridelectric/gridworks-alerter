# Seed request for gridworks-alerter (gwalerter).
#
# Regenerate the snapshot after editing this seed:
#   scripts/regen_sema_snapshot.sh
# (runs `sema snapshot prepare <this file>` + `build --package-name gwalerter`
# in the sema repo, then mirrors output/sema -> src/gwalerter/sema).
# src/gwalerter/sema is generated — edit this seed, not the vendored output.
#
# The alerter decodes what the fleet's scadas send: every report.event
# version on the wire, and the published layout.lite versions the current
# scada releases send, projects the registry's forest broadcasts and
# requests one at boot, emits gw.alert, and pages through Opsgenie with
# the gw.opsgenie words: the tap's create and close requests and the
# alert as Opsgenie lists it back. A box runs a published-only
# snapshot (the regen's default); a dev round may build with
# --allow-staged, and that snapshot is marked dev-only and never ships.

initial_targets:
  types:
    report.event:
      include_all_versions: true
    layout.lite:
      versions: ["011", "012"]
    gw.alert:
      versions: ["000"]
    gw.opsgenie.alert.create:
      versions: ["000"]
    gw.opsgenie.alert.close:
      versions: ["000"]
    gw.opsgenie.alert:
      versions: ["000"]
    g.node.forest:
      versions: ["002"]
    g.node.forest.request:
      versions: ["000"]

local_names:
  strip_prefixes: [gw1, gw]
