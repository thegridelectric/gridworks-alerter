metadata:
  registry_version: "1.0"
  last_updated: "2026-11-24T18:40:00Z"
  maintainer: "gridworks-energy"

formats:
  handle.name:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/handle.name"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier with hyphen-friendly lowercase segments"

  hh.mm:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/hh.mm"
    created: "2026-08-12T22:15:00Z"
    status: "published"
    description: "Wall-clock time of day at minute resolution, 24-hour zero-padded HH:MM (00:00 through 23:59); timezone-free"

  iana.timezone.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/iana.timezone.str"
    created: "2026-09-17T20:10:00Z"
    status: "published"
    description: "Shape of an IANA tz-database identifier: one to three slash-separated segments of letters, digits, underscore, plus, or minus (e.g. America/New_York, Etc/GMT+5, UTC); validates shape only, not membership in the current tz database"

  left.right.dot:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/left.right.dot"
    created: "2022-01-01T00:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier composed of lowercase alphanumeric segments"

  non.empty.string:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/non.empty.string"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "String with at least one character"

  positive.int:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/positive.int"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Positive integer with non-coercive serialized validation"

  sema.version:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/sema.version"
    created: "2026-10-22T20:00:00Z"
    status: "published"
    description: "Three-digit version string of a versioned Sema vocabulary word"

  spaceheat.name:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/spaceheat.name"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Single-segment lowercase identifier with optional internal hyphen-separated words"

  utc.milliseconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.milliseconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole milliseconds since Unix epoch (2000–3000 range)"

  utc.seconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.seconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole seconds since Unix epoch (2000–3000 range)"

  uuid4.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/uuid4.str"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Canonical lowercase UUIDv4 string (RFC 4122) in 8-4-4-4-12 format"

enums:
  base.g.node.class:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Universal physical ontology classification for Grid Nodes"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/base.g.node.class/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

  day.of.week:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Day of the civil week, for schedules that bind behavior to particular days (e.g. time-of-use windows)."
    schema_url: "https://schemas.electricity.works/enums/day.of.week/000"
    created: "2026-08-12T22:15:00Z"
    status: "published"

  fsm.report.type:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Enumeration of atomic FSM report categories."
    schema_url: "https://schemas.electricity.works/enums/fsm.report.type/000"
    created: "2024-10-08T17:17:00Z"
    status: "published"

  g.node.status:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Lifecycle status of a Grid Node within the registry"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.status/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

  gw.alert.category:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "What kind of subject an alert is about: a house, the fleet, or a platform service; decides the kind enum and the subject field."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/gw.alert.category/000"
        created: "2026-09-16T17:45:00Z"
        status: "published"

  gw.alert.state:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Whether an alert record raises the alert (Firing) or resolves it (Resolved)."
    schema_url: "https://schemas.electricity.works/enums/gw.alert.state/000"
    created: "2026-09-16T17:45:00Z"
    status: "published"

  gw.fleet.alert.kind:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "The condition a fleet alert is about, one value per detector, named for what a human acts on."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/gw.fleet.alert.kind/000"
        created: "2026-09-16T17:45:00Z"
        status: "published"

  gw.house.alert.kind:
    latest_version: "001"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "The condition a house alert is about, one value per detector, named for what a human acts on rather than the detector's mechanism."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/enums/gw.house.alert.kind/001"
        created: "2026-10-19T12:10:00Z"
        status: "published"
        added_values:
          - "ScadaSilent"
          - "LtnSilent"
      "000":
        schema_url: "https://schemas.electricity.works/enums/gw.house.alert.kind/000"
        created: "2026-09-15T19:35:00Z"
        status: "published"

  gw.opsgenie.alert.status:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Whether Opsgenie holds an alert Open or Closed."
    schema_url: "https://schemas.electricity.works/enums/gw.opsgenie.alert.status/000"
    created: "2026-10-07T12:20:00Z"
    status: "published"

  gw.opsgenie.priority:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Opsgenie's five alert priorities, P1 the most urgent."
    schema_url: "https://schemas.electricity.works/enums/gw.opsgenie.priority/000"
    created: "2026-10-07T12:20:00Z"
    status: "published"

  gw.platform.alert.kind:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "The condition a platform-service alert is about, one value per check, named for what a human acts on."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/gw.platform.alert.kind/000"
        created: "2026-09-16T17:45:00Z"
        status: "published"

  gw1.actor.class:
    latest_version: "014"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Classification of actors in the GridWorks SCADA system."

    versions:
      "014":
        schema_url: "https://schemas.electricity.works/enums/gw1.actor.class/014"
        created: "2026-09-08T21:20:00Z"
        status: "published"
        added_values:
          - "FiveVBoss"
          - "HpWatch"
          - "ColdWatch"

  gw1.emission.method:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Method by which a derived or computed channel emits values."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/gw1.emission.method/000"
        created: "2026-02-02T22:17:00Z"
        status: "published"

  gw1.quantity:
    latest_version: "003"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "High-level physical or semantic quantity classification for telemetry values."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/enums/gw1.quantity/003"
        created: "2026-10-15T11:35:00Z"
        status: "published"
        added_values:
          - "Irradiance"
          - "Currency"

  gw1.unit:
    latest_version: "003"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Measurement-unit vocabulary used for derived channels."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/enums/gw1.unit/003"
        created: "2026-10-15T11:35:00Z"
        status: "published"
        added_values:
          - "WattsPerSquareMeter"
          - "MilesPerHourX10"
          - "FahrenheitX10"

  log.level:
    owner: gridworks-energy
    enum_type: "literal"
    description: "Logging level."
    schema_url: "https://schemas.electricity.works/enums/log.level/000"
    created: "2026-05-13T00:00:00Z"
    status: "published"

  relay.closed.or.open:
    owner: gridworks-energy
    enum_type: "literal"
    description: "FSM states for a simple relay with open and closed positions."
    schema_url: "https://schemas.electricity.works/enums/relay.closed.or.open/000"
    created: "2024-09-17T20:17:00Z"
    status: "published"

  relay.energization.state:
    owner: gridworks-energy
    enum_type: "literal"
    value_type: "integer"
    description: "Two-state relay energization state."
    schema_url: "https://schemas.electricity.works/enums/relay.energization.state/000"
    created: "2024-03-06T22:07:00Z"
    status: "published"

  spaceheat.telemetry.name:
    latest_version: "007"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Legacy Spaceheat telemetry-name vocabulary for raw channels."

    versions:
      "007":
        schema_url: "https://schemas.electricity.works/enums/spaceheat.telemetry.name/007"
        created: "2024-12-06T00:00:00Z"
        status: "published"
        added_values:
          - "BinaryState"

types:
  channel.readings:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Timestamped integer readings for one channel within a SCADA reporting context."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/channel.readings/002"
        created: "2024-10-12T17:43:44Z"
        status: "published"
        summary: "- ChannelId: remove - additionalProperties: true -> false"
        direct_dependencies:
          structural:
            - "spaceheat.name"
            - "utc.milliseconds"

  connectivity.edge.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Directed topological edge connecting two Grid Nodes in the physical electric network"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/connectivity.edge.gt/000"
        created: "2026-02-23T00:00:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "g.node.status:000"
            - "uuid4.str"

  data.channel.gt:
    latest_version: "004"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical definition of a telemetry channel representing directly captured measurements"

    versions:
      "004":
        schema_url: "https://schemas.electricity.works/types/data.channel.gt/004"
        created: "2026-10-15T16:00:00Z"
        status: "published"
        summary: "- Quantity: gw1.quantity 000 -> 003 - TelemetryQuantityConsistency axiom: spaceheat.telemetry.quantity.projection 000 -> 001"
        direct_dependencies:
          structural:
            - "gw1.quantity:003"
            - "left.right.dot"
            - "spaceheat.name"
            - "spaceheat.telemetry.name:007"
            - "utc.seconds"
            - "uuid4.str"
          axiom:
            - "spaceheat.telemetry.quantity.projection:001"

  derived.channel.gt:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Canonical definition of computed telemetry channels within a GridWorks system."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/derived.channel.gt/003"
        created: "2026-10-15T11:35:00Z"
        status: "published"
        summary: "- OutputUnit: gw1.unit 001 -> 003 - OutputQuantity: gw1.quantity 001 -> 003 - OutputUnitQuantityConsistency axiom: gw1.unit.quantity.projection 000 -> 001"
        direct_dependencies:
          structural:
            - "gw1.emission.method:000"
            - "gw1.quantity:003"
            - "gw1.unit:003"
            - "left.right.dot"
            - "positive.int"
            - "spaceheat.name"
            - "uuid4.str"
          axiom:
            - "gw1.unit.quantity.projection:001"

  fsm.atomic.report:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Single atomic FSM report item representing either an event or an action."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/fsm.atomic.report/001"
        created: "2025-04-23T18:03:00Z"
        status: "published"
        summary: "- ActionType: remove - Action: scalar -> unconstrained object payload"
        direct_dependencies:
          structural:
            - "fsm.report.type:000"
            - "handle.name"
            - "left.right.dot"
            - "utc.milliseconds"
            - "uuid4.str"
          axiom:
            - "relay.energization.state:000"
      "000":
        schema_url: "https://schemas.electricity.works/types/fsm.atomic.report/000"
        created: "2024-10-08T17:17:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "fsm.report.type:000"
            - "handle.name"
            - "left.right.dot"
            - "utc.milliseconds"
            - "uuid4.str"

  fsm.full.report:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Full FSM report emitted for one trigger, including its ordered atomic report items."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/fsm.full.report/001"
        created: "2025-04-23T18:03:00Z"
        status: "published"
        summary: "- AtomicList[]: fsm.atomic.report:000 -> 001"
        direct_dependencies:
          structural:
            - "fsm.atomic.report:001"
            - "spaceheat.name"
            - "uuid4.str"
      "000":
        schema_url: "https://schemas.electricity.works/types/fsm.full.report/000"
        created: "2024-10-08T17:41:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "fsm.atomic.report:000"
            - "spaceheat.name"
            - "uuid4.str"

  g.node.forest:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A forest of Grid Node subtrees: the subtrees under one or more root aliases, carried as their current GNodes plus the connectivity edges wiring them together."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/g.node.forest/002"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- Nodes rebind to g.node.gt:006; SendTimeMs joins required"
        direct_dependencies:
          structural:
            - "connectivity.edge.gt:000"
            - "g.node.gt:006"
            - "left.right.dot"
            - "utc.milliseconds"

  g.node.forest.request:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A read query for one or more Grid Node forests: the caller names root aliases and correlates the response by RequestId."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/g.node.forest.request/000"
        created: "2026-07-03T18:55:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "uuid4.str"

  g.node.gt:
    latest_version: "006"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Fundamental identity object representing physical and logical grid nodes"

    versions:
      "006":
        schema_url: "https://schemas.electricity.works/types/g.node.gt/006"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- Axiom 2 (PhysicalGNodeLocations) becomes activation-conditioned: PositionPointId is mandatory only when Status is Active — a Pending physical GNode may be locationless"
        direct_dependencies:
          structural:
            - "base.g.node.class:000"
            - "g.node.status:000"
            - "left.right.dot"
            - "uuid4.str"

  glitch:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Report of an unexpected system event with logging level, source node, and detail."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/glitch/000"
        created: "2026-05-13T00:00:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "log.level:000"
            - "spaceheat.name"
            - "utc.milliseconds"

  gw.alert:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "An alerting service's report that a condition needing human attention has started (Firing) or stopped (Resolved) holding, about a house, the fleet, or a platform service."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/gw.alert/001"
        created: "2026-10-19T12:15:00Z"
        status: "published"
        summary: "- Kind: gw.house.alert.kind 000 -> 001"
        direct_dependencies:
          structural:
            - "channel.readings:002"
            - "gw.alert.category:000"
            - "gw.alert.state:000"
            - "gw.fleet.alert.kind:000"
            - "gw.house.alert.kind:001"
            - "gw.platform.alert.kind:000"
            - "left.right.dot"
            - "utc.milliseconds"
            - "uuid4.str"
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.alert/000"
        created: "2026-09-16T17:45:00Z"
        status: "published"
        summary: "Initial Sema version. One word for both transitions (State), a Category choosing the Kind enum (axiom 1), House requiring a .ta AboutGNodeAlias (axiom 2), ResolvedMs iff Resolved (axiom 3)."
        direct_dependencies:
          structural:
            - "channel.readings:002"
            - "gw.alert.category:000"
            - "gw.alert.state:000"
            - "gw.fleet.alert.kind:000"
            - "gw.house.alert.kind:000"
            - "gw.platform.alert.kind:000"
            - "left.right.dot"
            - "utc.milliseconds"
            - "uuid4.str"

  gw.hack.alert.silences:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The houses whose alerts an alerting service is not paging right now, as a whole-list snapshot."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.hack.alert.silences/000"
        created: "2026-10-15T15:30:00Z"
        status: "published"
        summary: "Initial Sema version. Src and the list of silenced terminal asset aliases (axiom 1: every alias ends in .ta). A stop gap until an alert manager service owns silencing."
        direct_dependencies:
          structural:
            - "left.right.dot"

  gw.opsgenie.alert:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "One alert as Opsgenie's Alert API lists it, in the fields GridWorks reads: alias, status, acknowledgement, count, times, who acknowledged and closed."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.opsgenie.alert/000"
        created: "2026-10-07T12:20:00Z"
        status: "published"
        summary: "Initial Sema version. ClosedBy present iff Status is Closed (axiom 1)."
        direct_dependencies:
          structural:
            - "gw.opsgenie.alert.status:000"
            - "gw.opsgenie.priority:000"
            - "non.empty.string"
            - "positive.int"
            - "utc.milliseconds"
            - "uuid4.str"

  gw.opsgenie.alert.close:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The request a GridWorks tap posts to close an Opsgenie alert by alias from a gw.alert Resolved record."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.opsgenie.alert.close/000"
        created: "2026-10-07T12:20:00Z"
        status: "published"
        summary: "Initial Sema version."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "non.empty.string"
            - "uuid4.str"

  gw.opsgenie.alert.create:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The request a GridWorks tap posts to create an Opsgenie alert from a gw.alert Firing record, with the alert's facts as named details."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.opsgenie.alert.create/000"
        created: "2026-10-07T12:20:00Z"
        status: "published"
        summary: "Initial Sema version. House and About present together (axiom 1)."
        direct_dependencies:
          structural:
            - "gw.opsgenie.priority:000"
            - "left.right.dot"
            - "non.empty.string"
            - "uuid4.str"

  gw.state.machine:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Declaration of one state machine a running SCADA hosts: hosting node Name, state enum and its version."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.state.machine/000"
        created: "2026-10-22T20:00:00Z"
        status: "published"
        summary: "Initial version."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "sema.version"
            - "spaceheat.name"

  gw.tou.tariff:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A time-of-use tariff as the heating system sees it: Alias, DisplayName, TimezoneStr (iana.timezone.str) and the recurring on-peak windows; every other hour is off-peak."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.tou.tariff/000"
        created: "2026-09-17T20:10:00Z"
        status: "published"
        summary: "Initial version: Alias (left.right.dot), DisplayName, TimezoneStr (iana.timezone.str, the new format word replacing a bare string), OnPeakWindows (gw.tou.window list). Axiom 1: per-day window non-overlap (moved here from the two operational-params words)."
        direct_dependencies:
          structural:
            - "gw.tou.window:000"
            - "iana.timezone.str"
            - "left.right.dot"

  gw.tou.window:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "One recurring time-of-use window: a same-day wall-clock interval (hh.mm Start/End) bound to an explicit set of weekdays."

    versions:
